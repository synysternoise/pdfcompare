<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de PNs</title>
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
  --border:#e2e6ec; --border-strong:#c9d0da;
  --text:#101828; --text-2:#475467; --text-3:#7a8698;
  --accent:#2457e6; --accent-soft:#e9effd; --accent-text:#1d47bf;
  --part:#2457e6; --part-soft:#e9effd; --part-text:#1d47bf;
  --insert:#d07a0a; --insert-soft:#fdf1e1; --insert-text:#9a5500;
  --screw:#7c3aed; --screw-soft:#f2ebfe; --screw-text:#6227c9;
  --ok:#12805c; --warn:#b54708; --warn-soft:#fef3e7;
  --danger:#d92d20; --danger-soft:#fdeceb;
  --line:#aab4c3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --surface:#171b23; --surface-2:#1c212b; --surface-3:#232935;
    --border:#2a3140; --border-strong:#3a4356;
    --text:#e8ecf3; --text-2:#aab3c2; --text-3:#7d8799;
    --accent:#6b8fff; --accent-soft:#1e2a4a; --accent-text:#9db4ff;
    --part:#6b8fff; --part-soft:#1e2a4a; --part-text:#9db4ff;
    --insert:#f0a03c; --insert-soft:#3a2a14; --insert-text:#f5b866;
    --screw:#a98bff; --screw-soft:#2b2247; --screw-text:#c4b0ff;
    --ok:#3ccb8f; --warn:#f0a03c; --warn-soft:#3a2a14;
    --danger:#ff6b5e; --danger-soft:#3d1d1b;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 40px rgba(0,0,0,.5); --line:#4a5468;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --surface-2:#1c212b; --surface-3:#232935;
  --border:#2a3140; --border-strong:#3a4356;
  --text:#e8ecf3; --text-2:#aab3c2; --text-3:#7d8799;
  --accent:#6b8fff; --accent-soft:#1e2a4a; --accent-text:#9db4ff;
  --part:#6b8fff; --part-soft:#1e2a4a; --part-text:#9db4ff;
  --insert:#f0a03c; --insert-soft:#3a2a14; --insert-text:#f5b866;
  --screw:#a98bff; --screw-soft:#2b2247; --screw-text:#c4b0ff;
  --ok:#3ccb8f; --warn:#f0a03c; --warn-soft:#3a2a14;
  --danger:#ff6b5e; --danger-soft:#3d1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 40px rgba(0,0,0,.5); --line:#4a5468;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono,.pn{font-family:var(--mono)}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.small{font-size:12.5px}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--screw));color:#fff}
.brand-mark svg{width:18px;height:18px;stroke-width:2}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--text-3);line-height:1.1}
.search{position:relative;flex:1;max-width:560px;margin-left:12px}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);width:16px;height:16px}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 44px 0 34px;font:inherit;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
kbd{font:11px var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-3);background:var(--surface)}
.search-results{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:min(460px,70vh);overflow:auto;padding:6px}
.sr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.sr.active,.sr:hover{background:var(--surface-3)}
.sr .pn{font-weight:600}
.sr-empty{padding:16px;text-align:center;color:var(--text-3)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
main{overflow:auto;padding:28px 36px 80px;min-width:0}
.main-inner{max-width:1180px;margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:550;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sm{width:26px;height:26px;border-radius:7px}
.icon-btn.sm svg{width:15px;height:15px}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.copy{opacity:.0;transition:opacity .12s}
*:hover>.copy,.copy:focus-visible{opacity:1}
@media (hover:none){.copy{opacity:.7}}

.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:550;color:var(--text-2);user-select:none;padding:0 6px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:34px;height:20px;border-radius:20px;background:var(--border-strong);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(14px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}

.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:40px;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-3)}
.menu button span{display:flex;flex-direction:column;line-height:1.3}
.menu button small{color:var(--text-3);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.menu .danger-item{color:var(--danger)}

/* ---------- tags & chips ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.peca{background:var(--part-soft);color:var(--part-text)}
.tag.inserto{background:var(--insert-soft);color:var(--insert-text)}
.tag.parafuso{background:var(--screw-soft);color:var(--screw-text)}
.tag.conjunto{background:var(--surface-3);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.thread{font-family:var(--mono);font-size:11.5px;border-color:color-mix(in srgb,var(--insert) 35%,var(--border));background:var(--insert-soft);color:var(--insert-text)}
.chip.head{font-size:11.5px;border-color:color-mix(in srgb,var(--screw) 30%,var(--border));background:var(--screw-soft);color:var(--screw-text)}
.chip.head b{font-family:var(--mono);font-weight:700}
.badge-pref{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;color:var(--insert-text);background:var(--insert-soft);padding:2px 8px;border-radius:999px}
.badge-pref svg{width:12px;height:12px;fill:currentColor;stroke:none}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico.peca{background:var(--part-soft);color:var(--part)}
.ico.inserto{background:var(--insert-soft);color:var(--insert)}
.ico.parafuso{background:var(--screw-soft);color:var(--screw)}
.ico.conjunto{background:var(--surface-3);color:var(--text-2)}
.ico.sm{width:24px;height:24px;border-radius:7px}
.ico.sm svg{width:14px;height:14px}
.ico.lg{width:52px;height:52px;border-radius:14px}
.ico.lg svg{width:26px;height:26px;stroke-width:1.6}
.pn-link{font-family:var(--mono);font-weight:650;border-bottom:1px solid transparent}
.pn-link:hover{border-bottom-color:currentColor}
.pn-link.peca{color:var(--part-text)}
.pn-link.inserto{color:var(--insert-text)}
.pn-link.parafuso{color:var(--screw-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

/* ---------- sidebar ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 12px 8px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button:hover{background:var(--surface-3)}
.tabs button.active{background:var(--surface-3);color:var(--text)}
.tabs .count{font-size:11px;font-weight:600;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.side-filter{position:relative;margin:0 12px 6px}
.side-filter svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3)}
.side-filter input{width:100%;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);padding:0 10px 0 29px;font:inherit;font-size:13px;color:var(--text);outline:none}
.side-filter input:focus{border-color:var(--accent)}
.side-list{flex:1;overflow:auto;padding:4px 8px 12px}
.side-group{margin-top:10px}
.side-group-head{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.side-group-head a:hover{color:var(--text)}
.side-group-head .n{margin-left:auto;font-weight:600}
.litem{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:8px;position:relative}
.litem:hover{background:var(--surface-3)}
.litem.active{background:var(--accent-soft)}
.litem.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.litem .pn{font-size:13px;font-weight:600}
.litem .meta{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;display:flex;align-items:center;gap:5px}
.side-empty{padding:24px 12px;text-align:center;color:var(--text-3);font-size:13px}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.status{display:flex;gap:9px;align-items:flex-start;font-size:12px;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);line-height:1.35;text-align:left;width:100%;cursor:default}
.status .dot{margin-top:4px}
.status b{display:block;font-weight:600;color:var(--text)}
.status span{color:var(--text-3)}
.status.local{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);cursor:pointer}

/* ---------- main content ---------- */
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin-bottom:18px;flex-wrap:wrap}
.crumbs a:hover{color:var(--text)}
.crumbs svg{width:13px;height:13px}
.crumbs .cur{color:var(--text-2);font-family:var(--mono)}
.hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.hero-body{flex:1;min-width:0}
.hero .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero h1{margin:6px 0 2px;font-size:30px;line-height:1.15;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:break-all}
.hero h1.pn{font-family:var(--mono);letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:var(--text-2);max-width:760px}
.hero-actions{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.stat b{display:block;font-size:22px;line-height:1.1;font-weight:700}
.stat span{font-size:12.5px;color:var(--text-2)}
.stat.warn b{color:var(--warn)}
.section{margin-top:30px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:16px;font-weight:650}
.section-head .muted{font-size:13px}
.section-head .right{margin-left:auto;display:flex;gap:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.empty{border:1.5px dashed var(--border-strong);border-radius:12px;padding:30px 20px;text-align:center;color:var(--text-2);background:var(--surface)}
.empty svg{width:28px;height:28px;color:var(--text-3);margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:2px}
.empty .btn{margin-top:12px}

/* tree (organograma): conjunto -> peças -> INSERTO (rosca) -> insertos -> parafusos */
.tree-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:22px;min-width:0}
.tree-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tree-bar>svg{color:var(--text-3)}
.tree-bar b{font-size:14.5px}
.tree-bar .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tree-hint{display:flex;gap:8px;align-items:center;margin:12px 14px 0;padding:8px 12px;border-radius:9px;background:var(--surface-2);color:var(--text-2);font-size:12.5px}
.tree-hint svg{width:15px;height:15px;color:var(--text-3)}
.tree-scroll{overflow-x:auto;padding:22px 12px 30px;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px}
.tree{width:max-content;min-width:100%}
.tree ul{display:flex;justify-content:center;margin:0;padding:24px 0 0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;display:flex;flex-direction:column;align-items:center;position:relative;padding:24px 7px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 10px 0 0}
.tree li:first-child::after{border-radius:10px 0 0 0}
.tree li:only-child::before{display:none}
.tree li:only-child::after{border-top:0;border-radius:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid var(--line)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px;max-width:250px;padding:9px 16px 11px;border:1.5px solid var(--border-strong);border-radius:11px;background:var(--surface);box-shadow:var(--shadow);text-align:center;font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
.node[data-act]{cursor:pointer}
.node[data-act]:hover{border-color:var(--accent)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node .nk{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.node .pn-link{font-size:14px}
.node .ns{font-size:11.5px;color:var(--text-3);line-height:1.35}
.node .ns.warn{color:var(--warn);font-weight:600}
.node .ns svg{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.node .chip{margin-top:3px}
.node .nacts{display:flex;gap:2px;margin-top:4px}
.node .caret{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border-strong);display:grid;place-items:center;font:700 13px/1 var(--mono);color:var(--text-2);z-index:1}
.node.part.open{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.node.part.open .caret{border-color:var(--accent);color:var(--accent-text)}
.node.thread{background:var(--insert-soft);border-color:color-mix(in srgb,var(--insert) 45%,var(--border));color:var(--insert-text);font-weight:750;letter-spacing:.03em;padding:10px 18px}
.node.ins{border-color:color-mix(in srgb,var(--insert) 50%,var(--border))}
.node.ins.open{border:2px solid var(--insert);box-shadow:0 0 0 4px color-mix(in srgb,var(--insert) 15%,transparent),var(--shadow)}
.node.ins.open .caret{border-color:var(--insert);color:var(--insert-text)}
.node.scr{border-color:color-mix(in srgb,var(--screw) 45%,var(--border))}
.node.root{border:0;box-shadow:none;background:none;padding:2px 12px 8px;max-width:none}
.node.root .root-t{font-size:24px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.15}
.node.root a.root-t:hover{color:var(--accent-text)}
.node.empty{border-style:dashed;box-shadow:none;background:var(--surface-2);color:var(--text-3);font-size:12px;font-style:italic;min-width:130px}
.node.ghost{border-style:dashed;box-shadow:none;background:var(--surface);color:var(--accent-text);font-weight:650;font-size:12.5px;flex-direction:row;justify-content:center;gap:5px;min-width:110px;cursor:pointer;border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.node.ghost:hover{background:var(--accent-soft)}
.node.ghost svg{width:15px;height:15px}
.node-go{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity .12s}
.node-go svg{width:14px;height:14px}
.node:hover .node-go,.node-go:focus-visible{opacity:1}
.node-go:hover{background:var(--surface-3);color:var(--accent-text)}
@media (hover:none){.node-go{opacity:.8}}
.node .pref{position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--insert);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.node .pref svg{width:12px;height:12px;fill:currentColor;stroke:none}

/* commodities (início) */

  : /wind\s*screen/i.test(name) ? 'windscreen' : /wardrobe|closet/i.test(name) ? 'wardrobe' : 'generic';

const asmArt = a => a.image ? `<img src="${esc(a.image)}" alt="">` : ART[artKey(a)];
function shrinkImage(file, max = 720) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.82);
      if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.85);
      resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui ler essa imagem.')); };
    img.src = url;
  });
}

const HEADS = {CSK: 'Escareada', PAN: 'Panela', HEX: 'Sextavada', FIL: 'Cilíndrica', SOC: 'Allen', TRU: 'Truss', WAF: 'Wafer'};
const THREADS = ['2-56', '4-40', '6-32', '8-32', '10-24', '10-32', '1/4-20', '1/4-28', 'M3', 'M4', 'M5', 'M6'];

/* ---------------- data ---------------- */
const SEED = JSON.parse($('#seed-data').textContent);
let db, idx, source = 'file', backedUp = false;
let sideTab = 'pecas', sideFilter = '', editing = false;

function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  d.version = 1;
  for (const k of ['assemblies', 'parts', 'inserts', 'screws']) if (!Array.isArray(d[k])) d[k] = [];
  d.parts.forEach(p => {
    if (!Array.isArray(p.inserts)) p.inserts = [];
    p.inserts.forEach(e => { if (!Array.isArray(e.screws)) e.screws = []; });
  });
  return d;
}
function loadDb() {
  const raw = lsGet(KEY);
  if (raw) {
    try {
      // Local edits are kept when they were made on top of this same file version
      // (base) or are newer than it; a newer exported file replaces older local edits.
      const st = JSON.parse(raw), local = st && st.data;
      if (local && (st.base === SEED.updatedAt || (local.updatedAt || '') > (SEED.updatedAt || ''))) {
        db = normalize(local);
        source = local.updatedAt === SEED.updatedAt ? 'file' : 'local';
        return;
      }
      // The file is newer than the edits saved in this browser: keep them aside so they can be recovered.
      if (local && local.updatedAt !== st.base) { lsSet(KEY + ':backup', raw); backedUp = true; }
      lsDel(KEY);
    } catch (_) {}
  }
  db = normalize(JSON.parse(JSON.stringify(SEED)));
  source = 'file';
}
function rebuild() {
  idx = {asm: new Map(), part: new Map(), ins: new Map(), scr: new Map(), insUse: new Map(), scrUse: new Map(), asmParts: new Map()};
  db.assemblies.forEach(a => idx.asm.set(a.id, a));
  db.parts.forEach(p => { idx.part.set(p.pn, p); pushMap(idx.asmParts, idx.asm.has(p.assembly) ? p.assembly : '', p); });
  db.inserts.forEach(i => idx.ins.set(i.pn, i));
  db.screws.forEach(s => idx.scr.set(s.pn, s));
  for (const p of db.parts) for (const e of p.inserts) {
    pushMap(idx.insUse, e.insert, {part: p, entry: e});
    for (const s of e.screws) pushMap(idx.scrUse, s, {part: p, entry: e});
  }
}
function commit(msg) {
  db.updatedAt = new Date().toISOString();
  if (lsSet(KEY, JSON.stringify({base: SEED.updatedAt, data: db}))) source = 'local';
  else toast('Atenção: o navegador não permitiu salvar. Use Dados › Salvar como HTML.', true);
  rebuild(); render();
  if (msg) toast(msg);
}

/* ---------------- routing ---------------- */
const href = (kind, id) => `#/${kind}/${encodeURIComponent(id)}`;
function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const i = raw.indexOf('/');
  return i < 0 ? {kind: raw, id: ''} : {kind: raw.slice(0, i), id: decodeURIComponent(raw.slice(i + 1))};
}
function go(kind, id) {
  const h = kind ? href(kind, id) : '#/';
  if (location.hash === h) render(); else location.hash = h;
}

const pnLink = (kind, pn) => `<a class="pn-link ${kind}" href="${href(kind, pn)}">${esc(pn)}</a>`;

const ico = (k, cls = '') => `<span class="ico ${k} ${cls}">${I[k]}</span>`;
const prefBadge = () => `<span class="badge-pref" title="Indicação preferencial (boa prática)">${I.star}Preferencial</span>`;

const delBtn = (act, data, title = 'Excluir') => `<button class="icon-btn sm danger edit-only" data-act="${act}" ${data} title="${title}" aria-label="${title}">${I.trash}</button>`;
const dattr = o => Object.entries(o).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
const asmName = id => idx.asm.get(id)?.name || 'Sem commodity';

function crumbs(items) {

function hero(kind, title, {desc, chips = '', actions = '', mono = true, icon = ''} = {}) {

function stat(icon, n, label, cls = '') {

function emptyBox(icon, title, text, btn = '') {

/* ---------------- tree (organograma) ---------------- */
const openParts = new Set();   // peças expandidas nas árvores de conjunto
const closedIns = new Set();   // insertos recolhidos ("PN|INSERTO")
const goLink = (kind, pn) => `<a class="node-go" href="${href(kind, pn)}" title="Abrir detalhes de ${esc(pn)}" aria-label="Abrir detalhes">${I.go}</a>`;
const treeWrap = lis => `<div class="tree-scroll"><div class="tree"><ul>${lis}</ul></div></div>`;
const ghost = (act, data, label) => `<li><button class="node ghost" data-act="${act}" ${data}>${I.plus}${esc(label)}</button></li>`;
function asmTree(id, withActions = true) {
  const a = idx.asm.get(id);
  const list = (idx.asmParts.get(id) || []).slice().sort((x, y) => cmp(x.pn, y.pn));
  const name = a ? a.name : 'Sem commodity';
  const root = `<div class="node root">${a ? `<a class="root-t" href="${href('conjunto', id)}">${esc(name)}</a>` : `<span class="root-t">${esc(name)}</span>`}</div>`;
  let kids = list.map(p => partLi(p, false)).join('');
  if (!list.length && !editing) kids += `<li><div class="node empty">Nenhuma peça</div></li>`;
  if (editing) kids += ghost('new-part', dattr({asm: a ? a.name : ''}), 'Peça');
  const A = dattr({asm: id});
  return `<div class="tree-card"><div class="tree-bar">${I.conjunto}<b>${esc(name)}</b><span class="faint small">${plural(list.length, 'peça')} · clique numa peça para abrir os insertos</span>
    <div class="right">${a && withActions ? editBtn('edit-assembly', dattr({id}), 'Editar commodity') + delBtn('delete-assembly', dattr({id}), 'Excluir commodity') : ''}
    <button class="btn sm" data-act="tree-all" ${A} data-open="1">Expandir tudo</button><button class="btn sm ghost" data-act="tree-all" ${A} data-open="">Recolher</button></div></div>
    ${treeWrap(`<li>${root}<ul>${kids}</ul></li>`)}</div>`;
}
function partLi(p, force) {
  const open = force || openParts.has(p.pn);
  const n = p.inserts.length;
  const P = dattr({part: p.pn});
  const node = `<div class="node part ${open ? 'open' : ''}" ${force ? '' : `data-act="tree-part" ${P} role="button" tabindex="0" aria-expanded="${open}"`}>
    <span class="nk">Peça</span>${force ? pnLink('peca', p.pn) : `<span class="pn-link peca">${esc(p.pn)}</span>${goLink('peca', p.pn)}`}
    ${p.description ? `<span class="ns">${esc(p.description)}</span>` : ''}
    <span class="ns ${n ? '' : 'warn'}">${n ? plural(n, 'inserto') : 'Sem inserto'}</span>
    ${editing ? `<span class="nacts">${editBtn('edit-part', P, 'Editar peça')}${delBtn('delete-part', P, 'Excluir peça')}</span>` : ''}
    ${force ? '' : `<span class="caret">${open ? '−' : '+'}</span>`}</div>`;
  if (!open) return `<li>${node}</li>`;
  const groups = new Map();
  p.inserts.forEach(e => pushMap(groups, idx.ins.get(e.insert)?.thread || '—', e));
  let kids = [...groups.keys()].sort(cmp).map(t =>
    `<li><div class="node thread">INSERTO (${esc(t)})</div><ul>${groups.get(t).map(e => insLi(p, e)).join('')}</ul></li>`).join('');
  if (!n && !editing) kids += `<li><div class="node empty">Nenhum inserto indicado</div></li>`;
  if (editing) kids += ghost('add-entry', P, 'Inserto');
  return `<li>${node}<ul>${kids}</ul></li>`;
}
function insLi(p, e) {
  const key = p.pn + '|' + e.insert;
  const open = !closedIns.has(key);
  const ins = idx.ins.get(e.insert) || {};
  const D = dattr({part: p.pn, ins: e.insert});
  const node = `<div class="node ins ${open ? 'open' : ''}" data-act="tree-ins" ${dattr({key})} role="button" tabindex="0" aria-expanded="${open}">
    ${e.preferred ? `<span class="pref" title="Preferencial (boa prática)">${I.star}</span>` : ''}
    <span class="nk">Inserto${e.preferred ? ' · preferencial' : ''}</span><span class="pn-link inserto">${esc(e.insert)}</span>${goLink('inserto', e.insert)}
    ${ins.description ? `<span class="ns">${esc(ins.description)}</span>` : ''}
    ${e.note ? `<span class="ns">${I.info}${esc(e.note)}</span>` : ''}
    ${editing ? `<span class="nacts">${editBtn('edit-entry', D, 'Editar indicação')}${delBtn('remove-entry', D, 'Remover inserto desta peça')}</span>` : ''}
    <span class="caret">${open ? '−' : '+'}</span></div>`;
  if (!open) return `<li>${node}</li>`;
  let kids = e.screws.map(pn => {
    const s = idx.scr.get(pn) || {};
    return `<li><div class="node scr"><span class="nk">Parafuso</span>${pnLink('parafuso', pn)}${headChip(s.head)}
      ${s.description ? `<span class="ns">${esc(s.description)}</span>` : ''}
      ${editing ? `<span class="nacts">${delBtn('remove-entry-screw', dattr({part: p.pn, ins: e.insert, scr: pn}), 'Remover parafuso')}</span>` : ''}</div></li>`;
  }).join('');
  if (!e.screws.length && !editing) kids += `<li><div class="node empty">Sem parafuso indicado</div></li>`;
  if (editing) kids += ghost('add-entry-screw', D, 'Parafuso');
  return `<li>${node}<ul>${kids}</ul></li>`;
}

let sr = [], srActive = 0;
function searchAll(q) {
  const f = fold(q).trim(), fa = alnum(q);
  if (!f) return [];
  const out = [];
  const score = (pn, ...rest) => {
    const p = fold(pn), pa = alnum(pn);
    if (p.startsWith(f) || (fa && pa.startsWith(fa))) return 0;
    if (p.includes(f) || (fa && pa.includes(fa))) return 1;
    if (rest.some(v => fold(v).includes(f))) return 2;
    return -1;
  };
  db.parts.forEach(p => { const s = score(p.pn, p.description, asmName(p.assembly)); if (s >= 0) out.push({kind: 'peca', pn: p.pn, sub: [asmName(p.assembly), p.description].filter(Boolean).join(' · '), s}); });
  db.inserts.forEach(i => { const s = score(i.pn, i.description, i.thread); if (s >= 0) out.push({kind: 'inserto', pn: i.pn, sub: [i.thread && 'Rosca ' + i.thread, i.description].filter(Boolean).join(' · '), s}); });
  db.screws.forEach(x => { const s = score(x.pn, x.description, x.head, HEADS[x.head], x.thread); if (s >= 0) out.push({kind: 'parafuso', pn: x.pn, sub: [x.head && `${x.head} · ${HEADS[x.head] || ''}`, x.thread && 'Rosca ' + x.thread, x.description].filter(Boolean).join(' · '), s}); });
  db.assemblies.forEach(a => { const s = score(a.name, a.description); if (s >= 0) out.push({kind: 'conjunto', pn: a.name, id: a.id, sub: plural((idx.asmParts.get(a.id) || []).length, 'peça'), s}); });

}

      if (v.p1 !== v.p2) return 'As duas senhas não são iguais.';
      const salt = buf2hex(crypto.getRandomValues(new Uint8Array(16))), iterations = 200000;
      db.editLock = {salt, iterations, hash: await pwHash(v.p1, salt, iterations)};
      unlockedHash = db.editLock.hash; ssSet(UNLOCK_KEY, unlockedHash);
      commit('Senha de edição alterada');
    },
  });
}

/* ---------------- import / export ---------------- */
function download(content, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportHtml() {
  const doc = new DOMParser().parseFromString(PRISTINE, 'text/html');
  doc.getElementById('seed-data').textContent = '\n' + JSON.stringify(db, null, 1).replace(/</g, '\\u003c') + '\n';
  download('<!DOCTYPE html>\n' + doc.documentElement.outerHTML, `Biblioteca_PN_${today()}.html`, 'text/html;charset=utf-8');
  toast('HTML gerado com os dados atuais — envie este arquivo para a equipe');

const CSV_COLS = ['Commodity', 'PN Peça', 'Descrição Peça', 'PN Inserto', 'Rosca', 'Descrição Inserto', 'Preferencial', 'PN Parafuso', 'Cabeça', 'Descrição Parafuso', 'Observação'];
function toCsv() {
  const rows = [];
  // Rosca é exportada como ="8-32" para o Excel não converter em data.
  const th = t => t ? `="${t}"` : '';
  for (const p of db.parts.slice().sort((a, b) => cmp(a.pn, b.pn))) {
    const a = idx.asm.get(p.assembly)?.name || '';
    if (!p.inserts.length) { rows.push([a, p.pn, p.description, '', '', '', '', '', '', '', '']); continue; }
    for (const e of p.inserts) {
      const i = idx.ins.get(e.insert) || {};
      const base = [a, p.pn, p.description, e.insert, th(i.thread), i.description, e.preferred ? 'Sim' : ''];
      if (!e.screws.length) rows.push([...base, '', '', '', e.note]);
      e.screws.forEach(s => { const x = idx.scr.get(s) || {}; rows.push([...base, s, x.head, x.description, e.note]); });
    }
  }
  const cell = v => { v = String(v ?? ''); return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [CSV_COLS, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
}
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const head = text.split(/\r?\n/, 1)[0];
  const cnt = c => head.split(c).length - 1;
  const sep = [';', ',', '\t'].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function importCsv(text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return toast('CSV sem linhas de dados', true);
  const key = s => fold(s).replace(/[^a-z0-9]+/g, ' ').trim();
  const H = rows[0].map(key);
  const col = (...names) => H.findIndex(h => names.includes(h));
  const C = {asm: col('commodity', 'conjunto'), part: col('pn peca', 'peca'), pdesc: col('descricao peca'), ins: col('pn inserto', 'inserto'), thr: col('rosca'),
    idesc: col('descricao inserto'), pref: col('preferencial'), scr: col('pn parafuso', 'parafuso'), head: col('cabeca'), sdesc: col('descricao parafuso'), note: col('observacao', 'obs')};
  if (C.part < 0) return toast('Coluna “PN Peça” não encontrada no CSV', true);
  const data = rows.slice(1);
  confirmBox('Importar CSV?', `${plural(data.length, 'linha')} serão <b>mescladas</b> com a biblioteca atual: itens novos são criados e descrições preenchidas no CSV substituem as existentes. Nada é apagado.`, 'Importar', () => {
    let np = 0, ni = 0, ns = 0;
    for (const r of data) {
      const g = k => C[k] >= 0 ? String(r[C[k]] ?? '').trim().replace(/^="(.*)"$/, '$1').trim() : '';
      const pn = normPn(g('part'));
      if (!pn) continue;
      let p = db.parts.find(x => x.pn === pn);
      if (!p) { p = {pn, description: '', assembly: '', notes: '', inserts: []}; db.parts.push(p); np++; }
      if (g('pdesc')) p.description = g('pdesc');
      if (g('asm')) p.assembly = asmIdByName(g('asm'));
      const ipn = normPn(g('ins'));
      if (!ipn) continue;
      let i = db.inserts.find(x => x.pn === ipn);
      if (!i) { i = {pn: ipn, thread: '', description: '', notes: ''}; db.inserts.push(i); ni++; }
      if (g('thr')) i.thread = g('thr');
      if (g('idesc')) i.description = g('idesc');
      let e = p.inserts.find(x => x.insert === ipn);
      if (!e) { e = {insert: ipn, preferred: false, note: '', screws: []}; p.inserts.push(e); }
      if (g('pref')) e.preferred = /^(s|sim|x|1|true|yes|y)$/i.test(g('pref'));
      if (g('note')) e.note = g('note');
      const spn = normPn(g('scr'));
      if (!spn) continue;
      let s = db.screws.find(x => x.pn === spn);
      if (!s) { s = {pn: spn, head: '', thread: i.thread, description: '', notes: ''}; db.screws.push(s); ns++; }
      if (g('head')) s.head = g('head').toUpperCase();
      if (g('sdesc')) s.description = g('sdesc');
      if (!e.screws.includes(spn)) e.screws.push(spn);
    }
    commit(`Importado: ${np} peça(s), ${ni} inserto(s), ${ns} parafuso(s) novos`);
  });
}
function importJson(text) {
  let d;
  try { d = JSON.parse(text); } catch (_) { return toast('Arquivo JSON inválido', true); }
  if (!d || !Array.isArray(d.parts)) return toast('JSON não parece ser uma Biblioteca de PNs', true);
  confirmBox('Substituir a biblioteca?', `Os dados atuais serão <b>substituídos</b> pelo conteúdo do arquivo (${plural(d.parts.length, 'peça')}).`, 'Substituir', () => {
    if (!d.editLock && db.editLock) d.editLock = db.editLock;
    db = normalize(d); commit('Biblioteca importada'); go('', '');
  });
}
$('#fileInput').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const text = await f.text();
  if (/\.json$/i.test(f.name) || text.trim().startsWith('{')) importJson(text); else importCsv(text);
});

/* ---------------- misc ---------------- */
let toastTimer;
function toast(msg, warn) {
  const t = $('#toast');
  t.innerHTML = (warn ? '' : I.check) + `<span>${esc(msg)}</span>`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, warn ? 5000 : 2600);
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast(msg || 'Copiado');
}
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || $('#dlg').open;
  if (!typing && (e.key === '/' || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); $('#q').focus(); }
  if (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey) && typing && !$('#dlg').open) { e.preventDefault(); $('#q').focus(); }
});
$('#editToggle').addEventListener('change', e => {
  const on = e.target.checked;
  if (on && !isUnlocked()) { e.target.checked = false; requireUnlock(() => setEditing(true)); return; }
  setEditing(on);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.node[data-act]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => {
  const k = route().kind;
  if (k === 'peca' || k === 'conjunto') sideTab = 'pecas';
  if (k === 'inserto') sideTab = 'insertos';
  if (k === 'parafuso') sideTab = 'parafusos';
  $('#app').classList.remove('side-open');
  render();
  $('#main').scrollTop = 0;
});
window.addEventListener('storage', ev => { if (ev.key === KEY) { loadDb(); rebuild(); render(); } });

/* ---------------- boot ---------------- */
const savedTheme = lsGet(THEME_KEY);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
loadDb(); rebuild();
const k0 = route().kind;
sideTab = k0 === 'inserto' ? 'insertos' : k0 === 'parafuso' ? 'parafusos' : 'pecas';
render();
if (backedUp) toast('O arquivo é mais novo que as edições salvas neste navegador. Elas foram guardadas em Dados › Recuperar edições antigas.', true);
})();
</script>
